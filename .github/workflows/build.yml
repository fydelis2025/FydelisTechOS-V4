name: Build FydelisTech OS

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verificar estrutura de pastas e includes
        run: |
          pwd
          ls -la
          ls -la include/syscalls/ || ls -la src/include/syscalls/ || true

      - name: Instalar toolchain (NASM, GCC, UEFI/GPT tools, genisoimage)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc binutils make python3 python3-pil python3-cairosvg genisoimage gdisk dosfstools mtools osslsigncode

      - name: Compilar Kernel, Gravar Wallpapers e Gerar ISO
        run: |
          make -C kernel clean
          make -C kernel all

      - name: Montar Imagem Hibrida UEFI + Legacy BIOS (kernel/fydelterm.img)
        run: |
          set -e
          IMG="kernel/fydelterm.img"
          KERNEL_BIN="kernel/kernel.bin"

          EFI_BIN=$(find . -maxdepth 4 -name "BOOTX64.EFI" | head -n 1)
          if [ -z "$EFI_BIN" ] && [ -f "boot/boot_uefi.asm" ]; then
            nasm -f bin boot/boot_uefi.asm -o boot/BOOTX64.EFI
            EFI_BIN="boot/BOOTX64.EFI"
            if [ -f "boot/keys/DB.pfx" ]; then
              osslsigncode sign -pkcs12 boot/keys/DB.pfx -pass "${{ secrets.UEFI_KEY_PASSWORD }}" -h sha256 \
                -n "FydelisTech OS Bootloader" -in "$EFI_BIN" -out "${EFI_BIN}.signed"
              mv "${EFI_BIN}.signed" "$EFI_BIN"
            fi
          fi

          MBR_BIN=$(find . -maxdepth 3 -name "mbr.bin" | head -n 1)

          dd if=/dev/zero of="$IMG" bs=1M count=64 status=none

          sgdisk -o "$IMG" >/dev/null
          sgdisk -n 1:8192:131000 -t 1:EF00 -c 1:"FYDELIS_ESP" "$IMG" >/dev/null

          dd if="$KERNEL_BIN" of="$IMG" bs=512 seek=4096 conv=notrunc status=none

          ESP_SECTORS=$((131000 - 8192 + 1))
          dd if=/dev/zero of=esp.part bs=512 count=$ESP_SECTORS status=none
          mkfs.fat -F 32 -n "FYDELISOS" esp.part >/dev/null

          mmd -i esp.part ::/EFI
          mmd -i esp.part ::/EFI/BOOT
          if [ -n "$EFI_BIN" ] && [ -f "$EFI_BIN" ]; then
            mcopy -i esp.part "$EFI_BIN" ::/EFI/BOOT/BOOTX64.EFI
          fi

          for cert in PK.cer KEK.cer DB.cer; do
            CERT_PATH=$(find . -maxdepth 4 -name "$cert" | head -n 1)
            [ -n "$CERT_PATH" ] && mcopy -i esp.part "$CERT_PATH" "::/$cert"
          done

          dd if=esp.part of="$IMG" bs=512 seek=8192 conv=notrunc status=none
          rm -f esp.part

          if [ -n "$MBR_BIN" ] && [ -f "$MBR_BIN" ]; then
            dd if="$MBR_BIN" of="$IMG" bs=440 count=1 conv=notrunc status=none
          fi

          sgdisk -e "$IMG" >/dev/null
          ls -lh "$IMG"

      - name: Publicar artefatos (fydelterm.img, fydelterm.iso e kernel.bin)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FydelisTechOS-build
          if-no-files-found: error
          path: |
            kernel/fydelterm.img
            kernel/fydelterm.iso
            kernel/kernel.bin

      - name: Criar Release Publica (ao enviar tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          gh release create "$TAG_NAME" \
            kernel/fydelterm.img \
            kernel/fydelterm.iso \
            --title "$TAG_NAME" \
            --generate-notes
